spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skyland
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
    # JPA 설정 (일반 데이터 관리용)
  jpa:
    hibernate:
      ddl-auto: update # Entity 변경 시 테이블 자동 업데이트
    properties:
      hibernate:
        format_sql: true # 로그에 SQL 예쁘게 출력
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # AWS 및 Bedrock 설정
  ai:
    model:
      embedding: bedrock-titan
      chat: bedrock-converse
    bedrock:
      aws:
        region: us-east-1
        access-key: ${AWS_ACCESS_KEY_ID}      # 환경변수에서 로드
        secret-key: ${AWS_SECRET_ACCESS_KEY}  # 환경변수에서 로드
        timeout: 5m
        connection-timeout: 5s
      converse:
        chat:
          options:
            model: us.anthropic.claude-3-5-sonnet-20241022-v2:0
            temperature: 0.0
            max-tokens: 1000
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0
          input-type: text
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024
        initialize-schema: true